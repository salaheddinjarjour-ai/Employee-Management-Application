appId: com.hrms.employeemanagement
productName: نظام إدارة الموظفين
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

win:
  target:
    - nsis
  icon: build/icon.png
  artifactName: نظام-إدارة-الموظفين-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: نظام إدارة الموظفين
  uninstallDisplayName: نظام إدارة الموظفين
  perMachine: false
  runAfterFinish: true

publish: null
